<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3ric Twitch 加權抽獎</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main class="container"><section class="card"><div class="logo">🎟️</div><h1>3ric Twitch 加權抽獎</h1><p class="subtitle">追隨者基本 1 張票，頻道點數可換額外票，票數公開、加權隨機抽獎。</p>
{% if not user %}<a class="btn twitch" href="/login">使用 Twitch 登入</a>{% else %}<div class="profile"><img src="{{ user.profile_image_url }}" class="avatar"><div class="profile-text"><small>管理頻道</small><strong>{{ user.display_name }}</strong></div><a class="logout" href="/logout">登出</a></div>
<div class="actions"><button id="updateButton" class="btn secondary">🔄 更新追隨者</button><button id="rewardButton" class="btn secondary">🎟️ 建立點數抽獎券</button><button id="drawButton" class="btn twitch">🎲 加權抽獎</button><a class="btn secondary" href="/public/{{ user.id }}" target="_blank">👀 公開票數頁</a></div>
<div class="settings"><label>每張抽獎券點數<input id="rewardCost" type="number" min="1" value="500"></label><label>每人最多額外票<input id="maxExtra" type="number" min="1" value="10"></label></div>
<p id="message" class="message">準備完成</p><div class="winner"><span>🎉 中獎者</span><strong id="winner">等待抽獎...</strong><small id="drawInfo"></small></div>
<div class="stats"><div class="stat"><span>參加人數</span><b id="participantCount">0</b></div><div class="stat"><span>總票數</span><b id="ticketCount">0</b></div></div>
<h2>公開票數 / 管理員修正</h2><div class="table-wrap"><table><thead><tr><th>觀眾</th><th>基本</th><th>點數換票</th><th>修正</th><th>總票</th><th>機率</th><th>管理</th></tr></thead><tbody id="ticketBody"></tbody></table></div>
{% endif %}<footer>抽獎使用系統安全亂數；管理員修正會留下紀錄。</footer></section></main>{% if user %}<script src="{{ url_for('static',filename='app.js') }}"></script>{% endif %}</body></html>
