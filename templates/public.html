<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ channel.display_name }} 公開抽獎票數</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main class="container"><section class="card"><div class="logo">🎟️</div><h1>{{ channel.display_name }} 公開抽獎票數</h1><p class="subtitle">每 5 秒自動更新。所有票數與目前中獎機率公開。</p><div class="stats"><div class="stat"><span>參加人數</span><b id="participantCount">0</b></div><div class="stat"><span>總票數</span><b id="ticketCount">0</b></div></div><div class="table-wrap"><table><thead><tr><th>觀眾</th><th>總票數</th><th>目前機率</th></tr></thead><tbody id="publicBody"></tbody></table></div></section></main><script>const cid={{ channel.channel_id|tojson }};async function load(){const d=await fetch('/api/public/'+cid).then(r=>r.json());participantCount.textContent=d.participants;ticketCount.textContent=d.total_tickets;publicBody.innerHTML=d.people.filter(x=>x.tickets>0).map(x=>`<tr><td>${esc(x.name)}</td><td><b>${x.tickets}</b></td><td>${x.chance}%</td></tr>`).join('')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();setInterval(load,5000)</script></body></html>
